name: QuickBite CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🩺 Expo Doctor
        run: npx expo-doctor

      - name: 🏗 Export Web Bundle (Dry Run)
        run: |
          # This ensures the app can bundle without errors
          npx expo export --platform web
